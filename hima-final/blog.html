<style>

.filters{position:sticky;top:67px;background:#FEFBF9;border-top:1px solid #F1E2E5;border-bottom:1px solid #F1E2E5;padding:14px 20px;display:flex;gap:8px;overflow-x:auto;z-index:20}
.filters button{border:1px solid #F1E2E5;background:#fff;color:#8B1A3A;padding:11px 20px;border-radius:999px;white-space:nowrap;cursor:pointer;font-weight:600;font-size:13.5px}

.card-img .cat{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.92);color:#8B1A3A;font-size:10px;font-weight:700;letter-spacing:.08em;padding:7px 12px;border-radius:999px}

.id{font-size:11px;color:#B89BA1}

.loading{text-align:center;padding:40px;color:#8A6E73}
</style></head><body>
<header><div class="logo">HIMA</div><div><div style="font-weight:800;letter-spacing:.12em;color:#8B1A3A;font-size:13px">HIMA TECH</div><div style="font-size:11px;letter-spacing:.08em;color:#8A6E73;font-weight:600">RCM SOLUTIONS</div></div></header>

<div class="filters" id="filters"></div>
<div class="grid" id="list"><div class="loading">Loading articles...</div></div>
<div class="modal" id="modal"><div class="modal-box">
<button class="close" onclick="closeArticle()">×</button>
<img id="m-img" src="" alt=""><div class="modal-body">
<span class="pill" id="m-date"></span>
<h2 id="m-title" style="font-size:30px"></h2><p id="m-excerpt" style="color:#8A6E73"></p><div id="m-content"></div>

</div></div></div>

<script>
let ALL = [];
const FALLBACK_IMG = 'https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=1200&q=80&auto=format&fit=crop';
function fmt(d){try{return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}).toUpperCase()}catch(e){return d}}
function normalize(p){
  return {
    id: String(p.id || Date.now()),
    title: p.title || 'Untitled',
    category: p.category || 'Medical Billing',
    excerpt: p.excerpt || '',
    slug: p.slug || ('post-'+String(p.id||'')),
    content: p.content || '',
    image: (p.image && p.image.trim() !== '') ? p.image : FALLBACK_IMG,
    imageAlt: p.imageAlt || p.title || '',
    date: p.date || '2026-11-07',
    readTime: p.readTime || '3 min read'
  };
}
function renderFilters(){
  const cats=['All',...new Set(ALL.map(p=>p.category))];
  document.getElementById('filters').innerHTML=cats.map(c=>`<button data-cat="${c}" class="${c==='All'?'active':''}">${c} <span>${c==='All'?ALL.length:ALL.filter(p=>p.category===c).length}</span></button>`).join('');
  document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); render(b.dataset.cat);
  });
}
function render(cat){
  const list = cat==='All'||!cat?ALL:ALL.filter(p=>p.category===cat);
  if(!list.length){ document.getElementById('list').innerHTML='<p style="grid-column:1/-1;text-align:center;color:#8A6E73">No articles found.</p>'; return; }
  document.getElementById('list').innerHTML=list.map(p=>`
  <article class="card">
    <div class="card-img">
      <img src="${p.image}" alt="${(p.imageAlt||p.title).replace(/"/g,'')}" onerror="this.src='${FALLBACK_IMG}'">
      <span class="date">${fmt(p.date)}</span><span class="cat">${p.category.toUpperCase()}</span>
    </div>
    <div class="body">
      <div class="meta"><span>${p.readTime}</span>•<span>Editorial Team</span></div>
      <h3>${p.title}</h3><p>${p.excerpt}</p>
      <div class="footer"><button class="read" onclick="openArticle('${p.slug}')">Read Article →</button><span class="id">#${p.id}</span></div>
    </div>
  </article>`).join('');
}
function openArticle(slug, push=true){
  const p = ALL.find(x=>x.slug===slug); if(!p) return;

  document.getElementById('m-img').src=p.image;
  document.getElementById('m-date').textContent=fmt(p.date)+' • '+p.category.toUpperCase();
  document.getElementById('m-title').textContent=p.title;
  document.getElementById('m-excerpt').textContent=p.excerpt;
  document.getElementById('m-content').innerHTML=p.content;

  // Popup ko full article page jaisa banao
  const modal = document.getElementById('modal');
  modal.style.display='block';
  modal.style.position='fixed';
  modal.style.top='0';
  modal.style.left='0';
  modal.style.width='100%';
  modal.style.height='100%';
  modal.style.overflowY='auto';
  modal.style.background='#fff';
  modal.style.zIndex='9999';
  window.scrollTo(0,0);

  // URL ko bhi article wala kar do
  if(push && window.location.pathname !== '/blog/'+slug){
    history.pushState({slug}, p.title, '/blog/'+slug);
  }
  document.title = p.title + ' | Hima Tech RCM';
}
function closeArticle(){
  document.getElementById('modal').style.display='none';
  history.pushState({}, '', '/blog');
  document.title = 'Blog | Hima Tech RCM';
}

// FALLBACK: agar Blog.json na mile to page khaali na ho

{"id":"1793500303729","title":"7 Ways to Reduce Medical Billing Denials","category":"Medical Billing","excerpt":"Discover seven actionable strategies to minimize claim rejections, streamline clinical documentation, and safeguard reimbursement cash flow for healthcare practices.","slug":"ways-to-reduce-medical-billing-denials","content":"<h2>1. Verify Eligibility Before Every Visit</h2><p>Most preventable denials start at the front desk. Verify coverage, benefits, and authorization requirements before the patient arrives.</p><h2>2. Get Documentation Right the First Time</h2><p>Clean claims need complete, specific documentation that supports medical necessity and correct coding.</p><h2>3. Code With Specificity</h2><p>Use the most specific ICD-10 and CPT codes available.</p><h2>4. Submit Claims Quickly</h2><p>Do not wait for month-end. Submit daily and track timely-filing deadlines by payer.</p><h2>5. Work Denials Every Day</h2><p>Denials are not dead claims. Categorize them by root cause, appeal within payer windows, and fix the workflow that caused them.</p>","image":"https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=1200&q=80&auto=format&fit=crop","date":"2026-11-01","readTime":"3 min read"},
{"id":"1793480244704","title":"Preparing Your Practice for ICD-10 Changes in 2027","category":"RCM","excerpt":"Explore key shifts in diagnostic specificity, revenue cycle risks, and EHR preparation strategies for healthcare providers approaching the 2027 coding updates.","slug":"icd-10-updates-2027-provider-guide","content":"<h2>What Changes in 2027?</h2><p>ICD-10 updates bring new, revised, and deleted codes, plus tighter expectations for specificity.</p><h2>3 Areas to Prepare Now</h2><h3>1. EHR & Encoder Updates</h3><p>Confirm your EHR, clearinghouse, and encoder will be updated before October 1.</p><h3>2. Documentation</h3><p>Train providers to document laterality, severity, encounter type, and causal relationships.</p><h3>3. Denial Monitoring</h3><p>Watch for new denial patterns in the first 60 days after go-live and fix them fast.</p>","image":"https://images.unsplash.com/photo-1579684385127-1ef15d508118?w=1200&q=80&auto=format&fit=crop","date":"2026-10-31","readTime":"3 min read"},
{"id":"1793474415387","title":"How to Reduce Medical Billing Denials in 2027","category":"Medical Billing","excerpt":"Discover proactive strategies for US healthcare providers to navigate predictive payer algorithms, fortify front-end workflows, and prevent claim denials in 2027.","slug":"how-to-reduce-medical-billing-denials-2027","content":"<h2>Why 2027 Will Be Different</h2><p>Payers are using more predictive algorithms and automated audits.</p><h2>The 2027 Prevention Playbook</h2><ul><li>Strengthen front-end: eligibility, benefits, and authorization checks</li><li>Document medical necessity clearly in every note</li><li>Use payer-specific coding rules, not generic coding</li><li>Appeal with data — show patterns, not just one claim</li><li>Review denials weekly and fix the root cause</li></ul>","image":"https://images.unsplash.com/photo-1521791136064-7986c2920216?w=1200&q=80&auto=format&fit=crop","date":"2026-10-31","readTime":"3 min read"},
{"id":"1793400000001","title":"When Do FY 2027 ICD-10-PCS Updates Go Into Effect?","category":"Medical Coding","excerpt":"FY 2027 ICD-10-PCS updates go into effect on October 1, 2026. Learn what hospitals and inpatient coders must update before the go-live date.","slug":"when-do-fy-2027-icd-10-pcs-updates-go-into-effect-effective","content":"<h2>Short Answer: October 1, 2026</h2><p>FY 2027 ICD-10-PCS updates go into effect on <strong>October 1, 2026</strong> for discharges on or after that date.</p><h2>What to Update Before October 1</h2><ul><li>Update your encoder, EHR, and grouper to the FY 2027 PCS version</li><li>Review new and deleted PCS codes that affect your top procedures</li><li>Train inpatient coders on new root operations, approaches, and devices</li></ul>","image":"https://images.unsplash.com/photo-1584982751601-97dcc096659c?w=1200&q=80&auto=format&fit=crop","date":"2026-10-30","readTime":"3 min read"},
{"id":"1793400000002","title":"ICD-10 Coding Pitfalls: Avoiding Compliance Risk","category":"Medical Coding","excerpt":"Learn the common ICD-10 coding mistakes that can lead to denials, audits, compliance risks, and lost revenue.","slug":"icd-10-coding-pitfalls-avoiding-compliance-risk","content":"<h2>The Most Common ICD-10 Pitfalls</h2><ul><li><strong>Unspecified codes:</strong> Using unspecified codes when the record supports a more specific code</li><li><strong>Copy-forward errors:</strong> Copying old diagnoses that are no longer active</li><li><strong>Missing laterality and severity:</strong> Leaving out details payers now require</li><li><strong>Wrong 7th character:</strong> Incorrect encounter type for injuries and fractures</li><li><strong>Outdated code sets:</strong> Coding with last year codes after October 1</li></ul><p>Hima Tech RCM provides coding audits and RCM support to keep practices compliant and paid correctly.</p>","image":"https://images.unsplash.com/photo-1504868584819-f8e8b4b6d7e3?w=1200&q=80&auto=format&fit=crop","date":"2026-10-28","readTime":"3 min read"}
];
async function load(){
  let data=null;
  const tries = ['Blog.json','blog.json','./Blog.json','./blog.json','/Blog.json','/blog.json','/blog/Blog.json','/blog/blog.json','../Blog.json','../blog.json','Blog.JSON'];
  for(const url of tries){
    try{
      const r = await fetch(url, {cache:'no-store'});
      if(r.ok){ const j = await r.json(); if(Array.isArray(j) && j.length){ data=j; break; } }
    }catch(e){}
  }
  if(!data){ data = FALLBACK; }
  ALL = data.map(normalize).sort((a,b)=> new Date(b.date) - new Date(a.date));
  document.getElementById('live-count').textContent = 'INSIGHTS FOR RCM TEAMS • ' + ALL.length + ' LIVE POSTS';
  renderFilters(); render('All');
}
load();
// Direct URL se aaye to article khud khul jaye
// Direct URL se aaye to article khud khul jaye - ALL ka wait karke
const slugFromUrl = window.location.pathname.replace('/blog/','').replace('/blog','').replace('/','');
if(slugFromUrl && slugFromUrl !== 'blog' && slugFromUrl !== ''){
  let tries = 0;
  const waitForData = setInterval(()=>{
    tries++;
    // ALL me data aa gaya?
    if(typeof ALL !== 'undefined' && ALL.length > 0){
      clearInterval(waitForData);
      openArticle(slugFromUrl, false);
    }
    // 10 second tak try karo, phir ruk jao
    if(tries > 30){
      clearInterval(waitForData);
    }
  }, 300);
}

<!DOCTYPE html>
<html lang="en"><head><style>

</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog | Hima Tech RCM Solutions</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#FEFBF9;color:#221315}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #F1E2E5;padding:14px 20px;display:flex;align-items:center;gap:10px;z-index:30}
.logo{background:#8B1A3A;color:#fff;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.hero{max-width:1280px;margin:0 auto;padding:36px 20px 10px} .hero h1{font-family:Georgia,serif;font-size:42px;line-height:.95;margin:10px 0}
.pill{display:inline-flex;gap:8px;align-items:center;background:#fff;border:1px solid #F1E2E5;padding:7px 14px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.1em;color:#8A6E73}
.filters{position:sticky;top:67px;background:#FEFBF9;border-top:1px solid #F1E2E5;border-bottom:1px solid #F1E2E5;padding:14px 20px;display:flex;gap:8px;overflow-x:auto;z-index:20}
.filters button{border:1px solid #F1E2E5;background:#fff;color:#8B1A3A;padding:11px 20px;border-radius:999px;white-space:nowrap;cursor:pointer;font-weight:600;font-size:13.5px}
.filters button.active{background:#8B1A3A;color:#fff;border-color:#8B1A3A}
.filters button span{background:#F8F2F0;padding:2px 7px;border-radius:999px;font-size:11px;margin-left:4px}
.filters button.active span{background:rgba(255,255,255,.2);color:#fff}
.grid{max-width:1280px;margin:0 auto;padding:24px 20px 80px;display:grid;grid-template-columns:1fr;gap:24px}
@media(min-width:768px){.grid{grid-template-columns:1fr 1fr}} @media(min-width:1024px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:#fff;border:1px solid #F1E2E5;border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.card-img{position:relative;height:220px;overflow:hidden;background:#F9E8EC}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.card-img .date{position:absolute;left:12px;top:12px;background:#221315;color:#fff;font-size:10px;font-weight:700;letter-spacing:.1em;padding:7px 12px;border-radius:999px}
.card-img .cat{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.92);color:#8B1A3A;font-size:10px;font-weight:700;letter-spacing:.08em;padding:7px 12px;border-radius:999px}
.body{padding:20px;display:flex;flex-direction:column;flex:1}
.meta{font-size:11px;color:#B89BA1;font-weight:600;display:flex;gap:8px;align-items:center}
.meta span{background:#F8F2F0;padding:4px 10px;border-radius:999px;color:#8A6E73}
.body h3{font-family:Georgia,serif;font-size:19px;line-height:1.25;margin:12px 0 10px}
.body p{font-size:13.5px;line-height:1.6;color:#8A6E73;margin:0}
.footer{margin-top:auto;padding-top:20px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #F1E2E5;margin-top:20px;padding-top:16px}
.read{color:#8B1A3A;font-weight:700;font-size:13px;background:none;border:0;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:4px}
.id{font-size:11px;color:#B89BA1}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;overflow-y:auto;padding:16px}
.modal-box{background:#fff;max-width:760px;margin:20px auto;border-radius:20px;overflow:hidden}
.modal-box img{width:100%;height:280px;object-fit:cover}
.modal-body{padding:28px}.modal-body h2{font-family:Georgia,serif;font-size:28px;line-height:1.2}
.modal-body p,.modal-body li{line-height:1.7;color:#444;font-size:15px}
.modal-body h2{font-size:20px;color:#221315;margin:20px 0 8px}
.close{float:right;font-size:28px;cursor:pointer;border:0;background:#fff;width:38px;height:38px;border-radius:50%;margin:12px}
.back{color:#8B1A3A;font-weight:700;background:none;border:0;cursor:pointer;font-size:14px}
.admin{position:fixed;right:20px;bottom:20px;background:#8B1A3A;color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;font-size:13px;text-decoration:none;z-index:99}
.loading{text-align:center;padding:40px;color:#8A6E73}
</style></head><body>
<header><div class="logo">HIMA</div><div><div style="font-weight:800;letter-spacing:.12em;color:#8B1A3A;font-size:13px">HIMA TECH</div><div style="font-size:11px;letter-spacing:.08em;color:#8A6E73;font-weight:600">RCM SOLUTIONS</div></div></header>
<div class="hero"><span class="pill"><span style="width:6px;height:6px;background:#8B1A3A;border-radius:50%;display:inline-block"></span> <span id="live-count">INSIGHTS FOR RCM TEAMS • LOADING...</span></span><h1>Medical Billing<br>& Growth Blog</h1><p style="color:#8A6E73;max-width:560px;line-height:1.6">Actionable guides on billing, coding, credentialing, payer enrollment and marketing — written by Hima Tech RCM operators for practices and RCM companies.</p></div>
<div class="filters" id="filters"></div>
<div class="grid" id="list"><div class="loading">Loading articles from Blog.json...</div></div>
<div class="modal" id="modal"><div class="modal-box">
<button class="close" onclick="closeArticle()">×</button>
<img id="m-img" src="" alt=""><div class="modal-body">
<span class="pill" id="m-date"></span>
<h2 id="m-title" style="font-size:30px"></h2><p id="m-excerpt" style="color:#8A6E73"></p><div id="m-content"></div>
<br><button class="back" onclick="closeArticle()">← Back to Blog</button>
</div></div></div>
<a class="admin" href="/admin">⚙ Admin</a>
<script>
let ALL = [];
const FALLBACK_IMG = 'https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=1200&q=80&auto=format&fit=crop';
function fmt(d){try{return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}).toUpperCase()}catch(e){return d}}
function normalize(p){
  return {
    id: String(p.id || Date.now()),
    title: p.title || 'Untitled',
    category: p.category || 'Medical Billing',
    excerpt: p.excerpt || '',
    slug: p.slug || ('post-'+String(p.id||'')),
    content: p.content || '',
    image: (p.image && p.image.trim() !== '') ? p.image : FALLBACK_IMG,
    imageAlt: p.imageAlt || p.title || '',
    date: p.date || '2026-11-07',
    readTime: p.readTime || '3 min read'
  };
}
function renderFilters(){
  const cats=['All',...new Set(ALL.map(p=>p.category))];
  document.getElementById('filters').innerHTML=cats.map(c=>`<button data-cat="${c}" class="${c==='All'?'active':''}">${c} <span>${c==='All'?ALL.length:ALL.filter(p=>p.category===c).length}</span></button>`).join('');
  document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); render(b.dataset.cat);
  });
}
function render(cat){
  const list = cat==='All'||!cat?ALL:ALL.filter(p=>p.category===cat);
  if(!list.length){ document.getElementById('list').innerHTML='<p style="grid-column:1/-1;text-align:center;color:#8A6E73">No articles found.</p>'; return; }
  document.getElementById('list').innerHTML=list.map(p=>`
  <article class="card">
    <div class="card-img">
      <img src="${p.image}" alt="${(p.imageAlt||p.title).replace(/"/g,'')}" onerror="this.src='${FALLBACK_IMG}'">
      <span class="date">${fmt(p.date)}</span><span class="cat">${p.category.toUpperCase()}</span>
    </div>
    <div class="body">
      <div class="meta"><span>${p.readTime}</span>•<span>Editorial Team</span></div>
      <h3>${p.title}</h3><p>${p.excerpt}</p>
      <div class="footer"><button class="read" onclick="openArticle('${p.slug}')">Read Article →</button><span class="id">#${p.id}</span></div>
    </div>
  </article>`).join('');
}
function openArticle(slug){
  const p = ALL.find(x=>x.slug===slug); if(!p) return;
  document.getElementById('m-img').src=p.image;
  document.getElementById('m-date').textContent=fmt(p.date)+' • '+p.category.toUpperCase();
  document.getElementById('m-title').textContent=p.title;
  document.getElementById('m-excerpt').textContent=p.excerpt;
  document.getElementById('m-content').innerHTML=p.content;
  document.getElementById('modal').style.display='block'; window.scrollTo(0,0);
}
function closeArticle(){ document.getElementById('modal').style.display='none'; }
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeArticle(); });
async function load(){
  let data=null;
  // Try Blog.json first (capital B - your file), then blog.json, then /Blog.json
  for(const url of ['Blog.json','blog.json','./Blog.json','/Blog.json']){
    try{
      const r = await fetch(url, {cache:'no-store'});
      if(r.ok){ data = await r.json(); break; }
    }catch(e){}
  }
  if(!data || !Array.isArray(data) || !data.length){
    document.getElementById('list').innerHTML='<p style="grid-column:1/-1;text-align:center;color:#8B1A3A">Blog.json not found. Make sure Blog.json is in the SAME folder as blog.html.</p>';
    return;
  }
  ALL = data.map(normalize).sort((a,b)=> new Date(b.date) - new Date(a.date));
  document.getElementById('live-count').textContent = 'INSIGHTS FOR RCM TEAMS • ' + ALL.length + ' LIVE POSTS';
  renderFilters(); render('All');
}
load();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>

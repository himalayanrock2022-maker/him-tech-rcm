<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <!-- SERVICES: Healthcare Operations -->
  
  <!-- Stethoscope -->
  <g transform="translate(620,60)" fill="none" stroke="rgba(255,255,255,.30)" stroke-width="2.5">
    <circle cx="35" cy="60" r="18"/>
    <path d="M35 42 Q35 12 18 12"/>
    <path d="M18 12 Q0 12 0 28"/>
    <circle cx="0" cy="32" r="6"/>
  </g>
  
  <!-- Clipboard -->
  <g transform="translate(80,60)" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="2.5">
    <rect x="8" y="14" width="65" height="85" rx="6"/>
    <rect x="22" y="4" width="32" height="18" rx="5"/>
    <line x1="20" y1="45" x2="58" y2="45" stroke-width="2"/>
    <line x1="20" y1="58" x2="52" y2="58" stroke-width="2"/>
    <line x1="20" y1="71" x2="55" y2="71" stroke-width="2"/>
    <line x1="20" y1="84" x2="45" y2="84" stroke-width="2"/>
  </g>
  
  <!-- Gear -->
  <g transform="translate(680,320)" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="2.5">
    <circle cx="30" cy="30" r="12"/>
    <circle cx="30" cy="30" r="22"/>
    <line x1="30" y1="2" x2="30" y2="10"/>
    <line x1="30" y1="50" x2="30" y2="58"/>
    <line x1="2" y1="30" x2="10" y2="30"/>
    <line x1="50" y1="30" x2="58" y2="30"/>
  </g>
  
  <!-- Checklist -->
  <g transform="translate(450,50)" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="2.5">
    <rect x="0" y="0" width="60" height="72" rx="6"/>
    <path d="M12 20 L18 26 L28 14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="34" y1="20" x2="52" y2="20" stroke-width="2"/>
    <path d="M12 38 L18 44 L28 32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="34" y1="38" x2="48" y2="38" stroke-width="2"/>
    <path d="M12 56 L18 62 L28 50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="34" y1="56" x2="50" y2="56" stroke-width="2"/>
  </g>
  
  <!-- Bar chart -->
  <g transform="translate(120,320)" fill="rgba(255,255,255,.22)">
    <rect x="0" y="25" width="16" height="40" rx="3"/>
    <rect x="22" y="12" width="16" height="53" rx="3"/>
    <rect x="44" y="0" width="16" height="65" rx="3"/>
    <rect x="66" y="18" width="16" height="47" rx="3"/>
  </g>
  
  <!-- DNA helix -->
  <path d="M400 0 C420 70, 380 140, 400 210 C420 280, 380 350, 400 420" stroke="rgba(255,255,255,.18)" stroke-width="2" fill="none"/>
  <path d="M420 0 C400 70, 440 140, 420 210 C400 280, 440 350, 420 420" stroke="rgba(255,255,255,.18)" stroke-width="2" fill="none"/>
  <line x1="402" y1="35" x2="418" y2="35" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
  <line x1="395" y1="105" x2="425" y2="105" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
  <line x1="398" y1="175" x2="422" y2="175" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
  <line x1="395" y1="245" x2="425" y2="245" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
  <line x1="398" y1="315" x2="422" y2="315" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
  
  <!-- Medical cross -->
  <g transform="translate(280,60)">
    <rect x="0" y="5" width="12" height="22" rx="3" fill="rgba(255,255,255,.22)"/>
    <rect x="-5" y="10" width="22" height="12" rx="3" fill="rgba(255,255,255,.22)"/>
  </g>
  
  <!-- Floating dots -->
  <circle cx="250" cy="200" r="5" fill="rgba(255,255,255,.20)"/>
  <circle cx="550" cy="380" r="4" fill="rgba(255,255,255,.18)"/>
  <circle cx="750" cy="180" r="4.5" fill="rgba(255,255,255,.20)"/>
  <circle cx="60" cy="420" r="3.5" fill="rgba(255,255,255,.18)"/>
</svg>

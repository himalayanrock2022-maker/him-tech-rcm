<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#062b47" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#0b5078" stop-opacity=".08"/>
      <stop offset="1" stop-color="#0c88a4" stop-opacity=".12"/>
    </linearGradient>
  </defs>
  <!-- DNA Helix left -->
  <path d="M60 0 C80 50, 40 100, 60 150 C80 200, 40 250, 60 300" stroke="rgba(255,255,255,.07)" stroke-width="1.5" fill="none"/>
  <path d="M80 0 C60 50, 100 100, 80 150 C60 200, 100 250, 80 300" stroke="rgba(255,255,255,.07)" stroke-width="1.5" fill="none"/>
  <!-- DNA rungs left -->
  <line x1="62" y1="30" x2="78" y2="30" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
  <line x1="55" y1="75" x2="85" y2="75" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
  <line x1="58" y1="120" x2="82" y2="120" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
  <line x1="62" y1="170" x2="78" y2="170" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
  <line x1="55" y1="220" x2="85" y2="220" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
  <line x1="58" y1="270" x2="82" y2="270" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
  <!-- DNA Helix right -->
  <path d="M320 0 C340 50, 300 100, 320 150 C340 200, 300 250, 320 300" stroke="rgba(255,255,255,.06)" stroke-width="1.5" fill="none"/>
  <path d="M340 0 C320 50, 360 100, 340 150 C320 200, 360 250, 340 300" stroke="rgba(255,255,255,.06)" stroke-width="1.5" fill="none"/>
  <!-- DNA rungs right -->
  <line x1="322" y1="30" x2="338" y2="30" stroke="rgba(255,255,255,.04)" stroke-width="1"/>
  <line x1="315" y1="75" x2="345" y2="75" stroke="rgba(255,255,255,.04)" stroke-width="1"/>
  <line x1="318" y1="120" x2="342" y2="120" stroke="rgba(255,255,255,.04)" stroke-width="1"/>
  <line x1="322" y1="170" x2="338" y2="170" stroke="rgba(255,255,255,.04)" stroke-width="1"/>
  <line x1="315" y1="220" x2="345" y2="220" stroke="rgba(255,255,255,.04)" stroke-width="1"/>
  <!-- Heartbeat line -->
  <path d="M0 150 L120 150 L140 120 L155 180 L170 100 L185 170 L200 130 L220 150 L400 150" stroke="rgba(255,255,255,.06)" stroke-width="1.5" fill="none"/>
  <!-- Medical cross top center -->
  <g transform="translate(195,40)">
    <rect x="0" y="4" width="10" height="18" rx="2" fill="rgba(255,255,255,.06)"/>
    <rect x="-4" y="8" width="18" height="10" rx="2" fill="rgba(255,255,255,.06)"/>
  </g>
  <!-- Medical cross bottom -->
  <g transform="translate(195,240)">
    <rect x="0" y="4" width="10" height="18" rx="2" fill="rgba(255,255,255,.05)"/>
    <rect x="-4" y="8" width="18" height="10" rx="2" fill="rgba(255,255,255,.05)"/>
  </g>
  <!-- Circles -->
  <circle cx="160" cy="60" r="3" fill="rgba(255,255,255,.05)"/>
  <circle cx="240" cy="80" r="2" fill="rgba(255,255,255,.05)"/>
  <circle cx="130" cy="220" r="2.5" fill="rgba(255,255,255,.04)"/>
  <circle cx="270" cy="200" r="2" fill="rgba(255,255,255,.04)"/>
  <!-- Pill shape -->
  <rect x="350" y="130" width="24" height="10" rx="5" fill="rgba(255,255,255,.04)" transform="rotate(-20 362 135)"/>
  <!-- Stethoscope hint -->
  <circle cx="200" cy="150" r="6" stroke="rgba(255,255,255,.05)" stroke-width="1" fill="none"/>
  <path d="M200 144 Q200 130 190 130" stroke="rgba(255,255,255,.04)" stroke-width="1" fill="none"/>
</svg>

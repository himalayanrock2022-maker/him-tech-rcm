<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <!-- CONTACT: Communication & Reach -->
  
  <!-- Large envelope -->
  <g transform="translate(80,80)" fill="none" stroke="rgba(255,255,255,.30)" stroke-width="2.5">
    <rect x="0" y="0" width="100" height="70" rx="8"/>
    <path d="M0 0 L50 38 L100 0"/>
  </g>
  
  <!-- Phone -->
  <g transform="translate(650,100)" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="2.5">
    <rect x="12" y="0" width="42" height="75" rx="8"/>
    <line x1="22" y1="60" x2="44" y2="60"/>
    <circle cx="33" cy="14" r="3"/>
  </g>
  
  <!-- Chat messages -->
  <rect x="500" y="250" width="130" height="45" rx="14" fill="rgba(255,255,255,.25)"/>
  <rect x="560" y="305" width="110" height="40" rx="12" fill="rgba(255,255,255,.18)"/>
  <rect x="520" y="355" width="100" height="38" rx="12" fill="rgba(255,255,255,.14)"/>
  
  <!-- Location pin -->
  <g transform="translate(200,280)" fill="none" stroke="rgba(255,255,255,.30)" stroke-width="2.5">
    <path d="M25 0 Q0 0 0 22 Q0 40 25 50 Q50 40 50 22 Q50 0 25 0Z"/>
    <circle cx="25" cy="20" r="8"/>
  </g>
  
  <!-- Signal waves -->
  <g transform="translate(400,120)" fill="none" stroke="rgba(255,255,255,.20)" stroke-width="2">
    <circle cx="0" cy="0" r="20"/>
    <circle cx="0" cy="0" r="35"/>
    <circle cx="0" cy="0" r="50"/>
    <circle cx="0" cy="0" r="65"/>
  </g>
  
  <!-- Clock -->
  <g transform="translate(680,300)" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2.5">
    <circle cx="25" cy="25" r="22"/>
    <line x1="25" y1="25" x2="25" y2="10"/>
    <line x1="25" y1="25" x2="38" y2="25"/>
  </g>
  
  <!-- Globe -->
  <g transform="translate(60,320)" fill="none" stroke="rgba(255,255,255,.20)" stroke-width="2">
    <circle cx="30" cy="30" r="28"/>
    <ellipse cx="30" cy="30" rx="12" ry="28"/>
    <line x1="2" y1="30" x2="58" y2="30"/>
    <line x1="8" y1="15" x2="52" y2="15"/>
    <line x1="8" y1="45" x2="52" y2="45"/>
  </g>
  
  <!-- Medical cross -->
  <g transform="translate(720,50)">
    <rect x="0" y="4" width="10" height="18" rx="2" fill="rgba(255,255,255,.22)"/>
    <rect x="-4" y="8" width="18" height="10" rx="2" fill="rgba(255,255,255,.22)"/>
  </g>
  
  <!-- Floating dots -->
  <circle cx="350" cy="400" r="5" fill="rgba(255,255,255,.20)"/>
  <circle cx="550" cy="50" r="4" fill="rgba(255,255,255,.18)"/>
  <circle cx="300" cy="80" r="4.5" fill="rgba(255,255,255,.20)"/>
  <circle cx="450" cy="380" r="3.5" fill="rgba(255,255,255,.18)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Secure medical billing illustration - shield, payment card, stethoscope and analytics</title>
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d5f98"/>
      <stop offset="1" stop-color="#0a4b7a"/>
    </linearGradient>
  </defs>

  <!-- Soft background blobs -->
  <circle cx="392" cy="64" r="96" fill="#00a8b5" opacity="0.12"/>
  <circle cx="70" cy="350" r="120" fill="#0a4b7a" opacity="0.08"/>

  <!-- Floating coin (top left) -->
  <circle cx="62" cy="150" r="16" fill="#ffd166"/>
  <circle cx="62" cy="150" r="11" fill="none" stroke="#0a4b7a" stroke-width="1.6" opacity="0.35"/>
  <text x="62" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0a4b7a">$</text>

  <!-- Green check bubble (top left, behind shield) -->
  <circle cx="112" cy="96" r="30" fill="#1fa45b"/>
  <path d="M98 96l10 10 20-22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Analytics document (bottom left, peeks from behind shield) -->
  <g>
    <rect x="66" y="216" width="76" height="64" rx="10" fill="#ffffff" stroke="#0a4b7a" stroke-width="4"/>
    <rect x="80" y="232" width="48" height="8" rx="4" fill="#00a8b5"/>
    <rect x="80" y="252" width="26" height="16" rx="3" fill="#0a4b7a" opacity="0.85"/>
    <rect x="112" y="244" width="20" height="24" rx="3" fill="#0a4b7a" opacity="0.45"/>
  </g>

  <!-- Main security shield -->
  <path d="M240 56 L342 92 V192 C342 282 302 334 240 358 C178 334 138 282 138 192 V92 Z" fill="url(#shieldGrad)"/>
  <path d="M240 78 L322 109 V192 C322 268 288 311 240 333 C192 311 158 268 158 192 V109 Z" fill="#ffffff"/>

  <!-- Pulse line inside shield -->
  <path d="M196 126h18l7-12 8 26 7-12h20" fill="none" stroke="#00a8b5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Payment card inside shield -->
  <rect x="182" y="156" width="116" height="82" rx="10" fill="#00a8b5"/>
  <rect x="276" y="172" width="9" height="11" rx="2" fill="#0a4b7a" opacity="0.45"/>
  <rect x="197" y="180" width="58" height="8" rx="4" fill="#ffffff" opacity="0.95"/>
  <rect x="197" y="196" width="40" height="6" rx="3" fill="#ffffff" opacity="0.65"/>

  <!-- Stethoscope (right side) -->
  <g>
    <path d="M402 108 C446 112 452 152 428 182 C410 205 372 210 362 236" fill="none" stroke="#0a4b7a" stroke-width="10" stroke-linecap="round"/>
    <circle cx="358" cy="256" r="15" fill="#0a4b7a"/>
    <circle cx="358" cy="256" r="6" fill="#00a8b5"/>
  </g>

  <!-- Heart accent above stethoscope -->
  <path d="M402 60 c-5-8-16-8-16 1 0 7 8 11 16 17 8-6 16-10 16-17 0-9-11-9-16-1z" fill="#ffd166"/>
</svg>
